# Cloud Build configuration for MCP Genmedia + Gemini CLI
steps:
  # Build the production Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/Dockerfile.production'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mcp-genmedia:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mcp-genmedia:latest'
      - '.'
    id: 'build-image'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mcp-genmedia:$BUILD_ID'
    id: 'push-image'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mcp-genmedia'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mcp-genmedia:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '900'
      - '--concurrency'
      - '10'
      - '--set-env-vars'
      - 'PROJECT_ID=$PROJECT_ID,LOCATION=$_REGION,GENMEDIA_BUCKET=$_GENMEDIA_BUCKET'
    id: 'deploy-cloudrun'

substitutions:
  _REGION: 'us-central1'
  _GENMEDIA_BUCKET: '${PROJECT_ID}-genmedia'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for the entire build
timeout: '1200s'

# Service account for the build
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/cloudbuild@$PROJECT_ID.iam.gserviceaccount.com'

# Build triggers
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/brave-api-key/versions/latest
      env: 'BRAVE_API_KEY'

# Additional build options
options:
  env:
    - 'DOCKER_BUILDKIT=1'
  substitutionOption: 'ALLOW_LOOSE'
